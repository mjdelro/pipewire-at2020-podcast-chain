context.modules = [
    {
        name = libpipewire-module-filter-chain

        args = {
            node.description = "AT2020 Processed"
            media.name = "AT2020 Processed"

            filter.graph = {
                nodes = [
                    {
                        type = ladspa
                        name = rnnoise
                        plugin = /usr/lib64/ladspa/librnnoise_ladspa.so
                        label = noise_suppressor_mono

                        control = {
                            # Keep RNNoise denoising, but disable its frame-level
                            # hard VAD mute. The installed plugin has no grace
                            # controls, so nonzero thresholds can chop syllables.
                            "VAD Threshold (%)" = 0.0
                        }
                    }

                    {
                        type = ladspa
                        name = gate
                        plugin = /usr/local/lib64/ladspa/lsp-plugins-ladspa-1.2.35.so
                        label = "http://lsp-plug.in/plugins/ladspa/gate_mono"

                        control = {
                            # Slow, mild downward expansion instead of switching
                            # the signal off. Threshold: -52 dB; reduction: -10 dB.
                            "Curve threshold (G)" = 0.0025119
                            "Attack (ms)" = 5.0
                            "Release (ms)" = 300.0
                            "Hold time (ms)" = 120.0
                            "Reduction (G)" = 0.3162278

                            "Input gain (G)" = 1.0
                            "Output gain (G)" = 1.0
                            "Makeup gain (G)" = 1.0

                            "Dry gain (G)" = 0.0
                            "Wet gain (G)" = 1.0
                            "Dry/Wet balance (%)" = 100.0
                        }
                    }

                    {
                        type = builtin
                        name = lowcut
                        label = bq_highpass

                        control = {
                            # Remove rumble/plosives while retaining chest tone.
                            "Freq" = 65.0
                            "Q" = 0.707
                        }
                    }

                    {
                        type = builtin
                        name = warmth
                        label = bq_lowshelf

                        control = {
                            # Broad body rather than a boomy narrow bass boost.
                            "Freq" = 125.0
                            "Q" = 0.70
                            "Gain" = 3.0
                        }
                    }

                    {
                        type = builtin
                        name = eq250
                        label = bq_peaking

                        control = {
                            "Freq" = 250.0
                            "Q" = 0.85
                            "Gain" = -2.5
                        }
                    }

                    {
                        type = builtin
                        name = eq500
                        label = bq_peaking

                        control = {
                            "Freq" = 500.0
                            "Q" = 1.10
                            "Gain" = -1.25
                        }
                    }

                    {
                        type = builtin
                        name = presence
                        label = bq_peaking

                        control = {
                            "Freq" = 3200.0
                            "Q" = 0.90
                            "Gain" = 1.5
                        }
                    }

                    {
                        type = builtin
                        name = air
                        label = bq_highshelf

                        control = {
                            # The AT2020 is already bright; keep this subtle.
                            "Freq" = 10500.0
                            "Q" = 0.70
                            "Gain" = 0.75
                        }
                    }

                    {
                        type = ladspa
                        name = compressor
                        plugin = /usr/local/lib64/ladspa/lsp-plugins-ladspa-1.2.35.so
                        label = "http://lsp-plug.in/plugins/ladspa/compressor_mono"

                        control = {
                            "Input gain (G)" = 1.0
                            "Output gain (G)" = 1.0

                            # -24 dB threshold, 3.5:1 ratio and a soft knee make
                            # speech denser while a 7 ms attack reins in the
                            # transient-heavy peaks seen in the longer test.
                            "Attack threshold (G)" = 0.0630957
                            "Attack time (ms)" = 7.0

                            "Release threshold (G)" = 0.0
                            "Release time (ms)" = 150.0

                            "Hold time (ms)" = 0.0
                            "Ratio" = 3.5
                            "Knee (G)" = 0.3981072

                            # +8 dB makeup.
                            "Makeup gain (G)" = 2.5118864

                            "Dry gain (G)" = 0.0
                            "Wet gain (G)" = 1.0
                            "Dry/Wet balance (%)" = 100.0
                        }
                    }

                    {
                        type = ladspa
                        name = deesser
                        plugin = /usr/local/lib64/ladspa/lsp-plugins-ladspa-1.2.35.so
                        label = "http://lsp-plug.in/plugins/ladspa/deesser_mono"

                        control = {
                            "Input gain (G)" = 1.0
                            "Output gain (G)" = 1.0

                            # Focus the detector on the upper vocal range.
                            "Enable frequency split" = 1
                            "Frequency split slope" = 1
                            "Split frequency (Hz)" = 4000.0
                            "Crossover band linkage (%)" = 0.0

                            "High-pass filter slope" = 1
                            "High-pass filter frequency (Hz)" = 4000.0
                            "High-pass filter qualifty factor" = 0.0

                            "Low-pass filter slope" = 0
                            "Low-pass filter frequency (Hz)" = 20000.0
                            "Low-pass filter qualifty factor" = 0.0

                            # Raise detector sensitivity by +3 dB around 8 kHz.
                            # This is sidechain EQ, not an audible treble boost.
                            "Peak filter 1 on" = 1
                            "Peak filter 1 frequency (Hz)" = 8000.0
                            "Peak filter 1 gain (G)" = 1.4125375
                            "Peak filter 1 qualifty factor" = 1.5

                            "Peak filter 2 on" = 0

                            # Roughly -22 dB threshold and 3:1 reduction.
                            "Threshold (G)" = 0.0794328
                            "Attack time (ms)" = 3.0
                            "Release time (ms)" = 80.0
                            "Hold time (ms)" = 8.0
                            "Ratio" = 3.0
                            "Knee (G)" = 0.501196
                        }
                    }

                    {
                        type = ladspa
                        name = limiter
                        plugin = /usr/local/lib64/ladspa/lsp-plugins-ladspa-1.2.35.so
                        label = "http://lsp-plug.in/plugins/ladspa/limiter_mono"

                        control = {
                            "Input gain (G)" = 1.0
                            "Output gain (G)" = 1.0

                            "Automatic level regulation" = 0
                            "Gain boost" = 0

                            "Operating mode" = 0
                            "Threshold (G)" = 0.8413951
                            "Knee level (G)" = 1.0

                            # -1.5 dB ceiling.
                            "Lookahead (ms)" = 5.0
                            "Attack time (ms)" = 4.0
                            "Release time (ms)" = 12.0

                            "Oversampling" = 1
                            "Dithering" = 0
                        }
                    }
                ]

                links = [
                    {
                        output = "rnnoise:Output"
                        input = "gate:Input"
                    }
                    {
                        output = "gate:Output"
                        input = "lowcut:In"
                    }
                    {
                        output = "lowcut:Out"
                        input = "warmth:In"
                    }
                    {
                        output = "warmth:Out"
                        input = "eq250:In"
                    }
                    {
                        output = "eq250:Out"
                        input = "eq500:In"
                    }
                    {
                        output = "eq500:Out"
                        input = "presence:In"
                    }
                    {
                        output = "presence:Out"
                        input = "air:In"
                    }
                    {
                        output = "air:Out"
                        input = "compressor:Input"
                    }
                    {
                        output = "compressor:Output"
                        input = "deesser:Input"
                    }
                    {
                        output = "deesser:Output"
                        input = "limiter:Input"
                    }
                ]

                inputs = [
                    "rnnoise:Input"
                ]

                outputs = [
                    "limiter:Output"
                ]
            }

            capture.props = {
                node.name = "capture.at2020_processed"
                node.passive = true
                audio.rate = 48000
                audio.channels = 1
                audio.position = [ MONO ]
            }

            playback.props = {
                node.name = "at2020_processed"
                node.description = "AT2020 Processed"
                media.class = Audio/Source
                audio.rate = 48000
                audio.channels = 1
                audio.position = [ MONO ]
            }
        }
    }
]
